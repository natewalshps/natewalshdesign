<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Work section background: dot field with a soft glow. Swap freely. -->
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e7dccb" fill-opacity=".22"/>
    </pattern>
    <radialGradient id="glow" cx="20%" cy="85%" r="55%">
      <stop offset="0" stop-color="#e2562f" stop-opacity=".28"/>
      <stop offset="1" stop-color="#e2562f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
    <mask id="m"><rect width="1600" height="1000" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#dots)" mask="url(#m)"/>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial Rows — Demo</title>
<!--
  Recreates the layout system + interactions (not the content/assets) observed on
  vertical.framer.media/work:
  1. Stack of full-bleed, half-viewport project rows. Each row CLIPS a taller
     composition, so giant headlines get sliced at row edges while you scroll
  2. 3-part row grid: text (~52%) | 100px ruled gutter | image (~48%)
  3. Hover (desktop) / in-view (touch): two half-width shutters collapse, the image
     settles from scale 1.12 -> 1, and a caption slides in
  4. Fixed nav with mix-blend-mode: difference (inverts over images and the green footer)
  5. Rolling-text hover on nav links (duplicated label slides up)
  6. Acid-green footer with a ruled band, oversized name, and a full-width wordmark
  Replace the gradient placeholders with your own images (set --img on .media).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f2f2; --ink:#050609; --muted:#6e6e6e; --accent:#81ff40;
    --sans:"Inter",system-ui,sans-serif; --mono:"Fragment Mono","IBM Plex Mono",ui-monospace,monospace;
    --row:50vh;               /* row window height */
    --ease:cubic-bezier(.7,0,.2,1);
    --gutter:100px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* ---------- NAV (difference blend) ---------- */
  .nav{position:fixed;inset:0 0 auto 0;height:60px;z-index:50;display:flex;align-items:center;justify-content:space-between;
       padding:0 24px;color:#fff;mix-blend-mode:difference;pointer-events:none}
  .nav *{pointer-events:auto}
  .logo{font-weight:700;font-size:28px;letter-spacing:-.06em}
  .menu{display:flex;gap:14px}
  .roll{display:inline-block;overflow:hidden;height:1em;line-height:1;font-weight:700;font-size:16px;letter-spacing:-.04em;text-transform:uppercase}
  .roll span{display:block;transition:transform .45s var(--ease)}
  .roll span+span{}
  .roll:hover span{transform:translateY(-100%)}

  /* ---------- ROWS ---------- */
  main{padding-top:60px}
  .row{position:relative;height:var(--row);overflow:hidden;display:grid;
       grid-template-columns:minmax(0,52fr) minmax(0,48fr);background:var(--bg)}
  /* The row is a clipping window. The copy block is pulled UP so the headline's first line
     straddles the row's top edge and gets sliced; the info tab pins to the bottom edge. */
  .left,.right{position:relative;height:100%;min-height:0}
  .rules{position:absolute;top:0;right:0;width:var(--gutter);height:100%;
         background:repeating-linear-gradient(to bottom,transparent 0 10px,rgba(0,0,0,.35) 10px 11px)}
  .copy{--t:clamp(44px,6.8vw,120px);position:absolute;left:24px;right:calc(var(--gutter) + 24px);
        top:calc(var(--t) * -1.05)}
  .label{font:500 12px/1.1 var(--sans);color:var(--muted);letter-spacing:-.03em}
  .title{font-weight:700;font-size:var(--t);line-height:.9;letter-spacing:-.06em;text-transform:uppercase;margin:.3em 0 .45em}
  .sub{font-weight:700;font-size:16px;line-height:1.1;letter-spacing:-.04em;text-transform:uppercase;max-width:40ch}
  .info{position:absolute;left:24px;bottom:20px;display:flex;gap:12px;background:var(--bg);padding:4px 16px 4px 0;z-index:2}
  .info i{width:8px;background:var(--ink)}
  .info b{display:block;font-weight:600;font-size:16px;letter-spacing:-.04em}
  .info small{font-weight:600;font-size:12px;letter-spacing:-.03em;color:var(--muted)}

  /* ---------- MEDIA + SHUTTER REVEAL ---------- */
  .media{position:absolute;inset:0;overflow:hidden;cursor:pointer}
  .media .img{position:absolute;inset:-6%;background:var(--img) center/cover;transform:scale(1.12);transition:transform 1.1s var(--ease)}
  .media .shutter{position:absolute;top:0;bottom:0;width:50.05%;background:var(--bg);transform-origin:50% 0;transition:transform .8s var(--ease)}
  .media .shutter.l{left:0} .media .shutter.r{right:0;transition-delay:.08s}
  .media .cap{position:absolute;right:24px;top:50%;width:min(360px,70%);color:#fff;opacity:0;transform:translateY(16px);
              transition:opacity .5s ease .25s, transform .7s var(--ease) .25s}
  .media .cap p{font-weight:700;font-size:20px;line-height:1.1;letter-spacing:-.04em}
  .media .cap small{display:block;margin-top:10px;font:400 10px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.02em;opacity:.8}
  .row.is-open .shutter{transform:scaleY(0)}
  .row.is-open .img{transform:scale(1)}
  .row.is-open .cap{opacity:1;transform:none}

  /* ---------- FOOTER ---------- */
  footer{position:relative;background:var(--accent);color:var(--ink);padding-top:60px}
  .ruleband{height:60px;margin-top:-60px;background:repeating-linear-gradient(to right,transparent 0 10px,rgba(0,0,0,.45) 10px 11px)}
  .bigname{font-weight:700;font-size:13.2vw;line-height:.9;letter-spacing:-.06em;padding:16px 24px 24px;white-space:nowrap}
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:24px;border-top:1px solid rgba(0,0,0,.25);border-bottom:1px solid rgba(0,0,0,.25)}
  .cols > div{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;letter-spacing:-.04em;text-transform:uppercase}
  .cols > div.bar{border-left:8px solid var(--ink);padding-left:16px}
  .mono{font:400 12px/1.4 var(--mono)!important;letter-spacing:0!important}
  .wordmark{font-weight:700;font-size:25.5vw;line-height:.78;letter-spacing:-.08em;text-align:center;padding-top:3vw;overflow:hidden}
  .legal{display:flex;justify-content:space-between;padding:12px 24px;font-weight:600;font-size:12px;letter-spacing:-.03em}

  /* ---------- RESPONSIVE / A11Y ---------- */
  @media (max-width:760px){
    :root{--row:70vh;--gutter:40px}
    .row{grid-template-columns:1fr}
    .right{position:absolute;inset:0 0 0 auto;width:45%;height:100%}
    .copy{right:calc(45% + 16px)}
    .cols{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav class="nav" aria-label="Primary">
  <a class="logo" href="#">yourname</a>
  <div class="menu">
    <a class="roll" href="#"><span>Work</span><span aria-hidden="true">Work</span></a>
    <a class="roll" href="#"><span>About</span><span aria-hidden="true">About</span></a>
    <a class="roll" href="#"><span>Notes</span><span aria-hidden="true">Notes</span></a>
    <a class="roll" href="#"><span>Contact</span><span aria-hidden="true">Contact</span></a>
  </div>
</nav>

<main id="rows"></main>

<footer>
  <div class="ruleband"></div>
  <div class="bigname">Your Full Name</div>
  <div class="cols">
    <div class="bar"><a href="#">(555) 010 2030</a><a class="mono" href="#">hello@yourdomain.com</a></div>
    <div><span>Studio</span><span class="mono">123 Example Ave<br>Minneapolis, MN<br>United States</span></div>
    <div class="bar"><a href="#">Home</a><a href="#">Work</a><a href="#">About</a><a href="#">Contact</a></div>
    <div><a href="#">LinkedIn</a><a href="#">Dribbble</a><a href="#">Read.cv</a></div>
  </div>
  <div class="wordmark" aria-hidden="true">NAME</div>
  <div class="legal"><span>© 2026 Your Name</span><a href="#top">↑</a><span>All rights reserved</span></div>
</footer>

<script>
/* ---------- Content (swap in your projects; img can be url('...')) ---------- */
const projects = [
  {label:'(Project)', title:'Quiet<br>Systems',  sub:'A design system built to disappear into the work.', client:'Self-initiated', date:'March 2026',
   cap:'Tokens, components and documentation that scale across twelve product teams.', tag:'Design systems', img:'linear-gradient(135deg,#1d2b2f,#6d8a8f 55%,#d9e2dc)'},
  {label:'(Project)', title:'Signal<br>& Noise', sub:'Designing an AI assistant people can actually trust.', client:'Health platform', date:'June 2026',
   cap:'Conversation patterns, guardrails and escalation paths for an enterprise agent.', tag:'AI experience', img:'linear-gradient(160deg,#2a2320,#a4653f 50%,#f0d2b4)'},
  {label:'(Project)', title:'Legacy<br>Rewired', sub:'Modernising decades-old screens without breaking the workflow.', client:'Enterprise client', date:'January 2026',
   cap:'An audit-to-pattern pipeline for migrating dense operational UIs.', tag:'Modernisation', img:'linear-gradient(120deg,#0e0f1a,#3b3f8c 50%,#b9bff2)'},
  {label:'(Project)', title:'Soft<br>Edges', sub:'A painting series about light, water and slow attention.', client:'Personal practice', date:'Ongoing',
   cap:'Oil on linen, exploring atmosphere and the edge of abstraction.', tag:'Fine art', img:'linear-gradient(200deg,#233020,#7e9b6a 50%,#eef0d8)'},
];

document.getElementById('rows').innerHTML = projects.map((p,i) => `
  <article class="row${i===0?' is-open':''}">
    <div class="left">
      <div class="rules"></div>
      <div class="copy">
        <p class="label">${p.label}</p>
        <h2 class="title">${p.title}</h2>
        <p class="sub">${p.sub}</p>
      </div>
      <div class="info"><i></i><div><b>${p.client}</b><small>${p.date}</small></div></div>
    </div>
    <div class="right">
      <a class="media" href="#" style="--img:${p.img}" aria-label="${p.title.replace('<br>',' ')}">
        <div class="img"></div>
        <div class="shutter l"></div><div class="shutter r"></div>
        <div class="cap"><p>${p.cap}</p><small>${p.tag}</small></div>
      </a>
    </div>
  </article>`).join('');

/* ---------- Reveal logic: hover on pointer devices, in-view on touch ---------- */
const rows = [...document.querySelectorAll('.row')];
const canHover = matchMedia('(hover:hover) and (pointer:fine)').matches;
if (canHover) {
  rows.forEach(r => {
    r.addEventListener('mouseenter', () => { rows.forEach(x => x.classList.toggle('is-open', x === r)); });
  });
} else {
  const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('is-open', e.isIntersecting)),
    { rootMargin: '-45% 0px -45% 0px' });          // opens the row crossing the screen centre
  rows.forEach(r => io.observe(r));
}
</script>
</body>
</html>
